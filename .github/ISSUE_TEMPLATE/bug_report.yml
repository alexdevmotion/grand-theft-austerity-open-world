name: Bug report
description: Report reproducible broken or unexpected behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Grand Theft Austerity. Please include enough detail for someone else to reproduce the problem.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed secrets, private data, and copyrighted or restricted assets from the report.
          required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Explain the problem and where in the game it occurred.
      placeholder: Describe the broken or unexpected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start or load ...
        2. Go to ...
        3. Press or select ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Provide the deployed version, branch, or commit SHA if known.
      placeholder: main, deployment URL, or commit SHA
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: Chrome 140 on macOS 16
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and additional context
      description: Add screenshots, recordings, console output, save-state details, or anything else that may help.
